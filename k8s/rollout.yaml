apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ai-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: app
          image: ghcr.io/gazzaly2003/ai-cicd:635eb5f3fe0cbf579ac91ef7dcd89e860b724d1e
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DELAY_MS
              value: "0"
            - name: FLAGS_FILE
              value: /etc/flags/flags.json
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
          volumeMounts:
            - name: flags
              mountPath: /etc/flags
      volumes:
        - name: flags
          configMap:
            name: ai-flags
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause:
            duration: 90s
        - setWeight: 60
        - pause:
            duration: 90s
      analysis:
        templates:
          - templateName: ai-quality
        startingStep: 1
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
