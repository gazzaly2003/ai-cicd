apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          image: python:3.12-slim
          command: ["python", "/app/loadgen.py"]
          volumeMounts:
            - name: code
              mountPath: /app
            - name: data
              mountPath: /data
      volumes:
        - name: code
          configMap:
            name: loadgen-code
        - name: data
          configMap:
            name: loadgen-data
