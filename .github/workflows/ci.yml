name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["k8s/**", "argocd/**", "README.md"]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/
      - name: Model quality gate
        run: python eval/evaluate.py --min-accuracy 0.90

  build-and-deploy:
    needs: test-and-eval
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Update manifest (GitOps)
        run: |
          sed -i "s|image: .*|image: ${IMAGE}:${GITHUB_SHA}|" k8s/rollout.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add k8s/rollout.yaml
          git commit -m "deploy ${GITHUB_SHA}" || echo "nothing to commit"
          git pull --rebase
          git push